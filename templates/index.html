<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h1>🛒 My Online Shop</h1>
        <p>Shop your favourite products</p>
    </header>

    <h2>Our Products</h2>

    <a href="login.html">🔐 Login</a>
    &nbsp;&nbsp;
    <a href="register.html">👤 Register</a>

    <br><br>

    <a href="cart.html">🛒 View Cart</a>

    <br><br>

    <div class="products">

        <div class="product">
            <h3>👕 T-Shirt</h3>
            <p>Comfortable cotton T-Shirt</p>
            <h3>₹499</h3>
            <button onclick="addToCart('T-Shirt', 499)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>👟 Shoes</h3>
            <p>Stylish casual shoes</p>
            <h3>₹999</h3>
            <button onclick="addToCart('Shoes', 999)">
                Add to Cart
            </button>
        </div>

        <div class="product">
            <h3>🎧 Headphones</h3>
            <p>Wireless headphones</p>
            <h3>₹799</h3>
            <button onclick="addToCart('Headphones', 799)">
                Add to Cart
            </button>
        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
